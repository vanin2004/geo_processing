services:

  file_storage:
    image: mrwight/file_storage:latest
    env_file:
      - ./file_storage/.env
    restart: always

  task_manager:
    build: ./backend
    env_file:
      - ./backend/.env
    restart: always    
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    restart: always    
    command: ["python3", "-u" ,"-m", "src.worker"]

  db:
    image: postgres:15
    env_file:
      - ./db/.env
    # volumes:
    #   # - ./volumes/postgres/data:/var/lib/postgresql/data
    #   - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    volumes:
      # - ./volumes/rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/.definitions.json:/etc/rabbitmq/.definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: always


  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: always

  
